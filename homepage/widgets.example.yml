# For configuration options and examples, please see:

- resources:
    label: System Resources
    cpu: true
    memory: true
    disk: /
    cputemp: true
    tempmin: 0
    tempmax: 100
    uptime: true
    units: metric
    refresh: 3000
    diskUnits: bytes
    network: true
    expanded: true

- datetime:
    text_size: xl
    format:
      dateStyle: short
      timeStyle: short
      hour12: false

- greeting:
    text_size: xl
    text: "Welcome to your Homelab"

- search:
    provider: duckduckgo
    target: _blank

- openmeteo:
    label: Weather
    latitude: 0.0000   # Replace with your latitude
    longitude: 0.0000  # Replace with your longitude
    timezone: America/CityName
    units: metric
    cache: 5
    format:
      maximumFractionDigits: 1
